name: 功能建议
description: 描述一个真实使用场景和当前绕路办法。
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 谁在什么场景遇到什么问题？
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: 现在怎样处理，有什么不便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 最小解决方案与预期效果
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 可替代方案、兼容性与维护成本
